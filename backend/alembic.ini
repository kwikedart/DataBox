[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://databox:databox_local_password@127.0.0.1:5434/databox

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
